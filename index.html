<style>

</div>

var QS=TEST.questions, T=TEST.types;
var SANS='"PingFang SC","Hiragino Sans GB","Noto Sans SC",-apple-system,sans-serif';
var INK='#16151D', CREAM='#F5F2EC', MUTED='#8A8577';
var SIG={"E":1,"I":-1,"X":1,"S":-1,"F":1,"L":-1};
var AXES=[{label:"外向指数"},{label:"探索指数"},{label:"直觉指数"}];
var cur=0, picks=[], res=null;

function show(id){['cover','quiz','result'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==id);});}
function start(){picks=new Array(QS.length).fill(null);cur=0;show('quiz');render();window.scrollTo(0,0);}
function retry(){show('cover');window.scrollTo(0,0);}
function editAnswers(){show('quiz');go(0);}
function render(){
 var q=QS[cur];
 document.getElementById('qnum').textContent=('0'+(cur+1)).slice(-2)+' / '+('0'+QS.length).slice(-2);
 document.getElementById('bar').style.width=(cur/QS.length*100)+'%';
 document.getElementById('qtxt').textContent=q.t;
 var box=document.getElementById('opts');box.innerHTML='';
 q.o.forEach(function(o,i){
  var b=document.createElement('button');
  b.className='opt'+(picks[cur]===i?' sel':'');
  b.textContent=o[0];
  b.onclick=function(){pick(i);};box.appendChild(b);});
 document.getElementById('back').disabled=(cur===0);
 var nb=document.getElementById('next');
 if(picks[cur]===null){nb.style.visibility='hidden';}
 else{nb.style.visibility='visible';
      nb.textContent=(cur===QS.length-1)?'看结果':'下一题 →';}
}
function go(i){cur=i;render();window.scrollTo(0,0);}
function back(){if(cur>0){go(cur-1);}}
function next(){
 if(picks[cur]===null){return;}
 if(cur<QS.length-1){go(cur+1);}
 else if(picks.indexOf(null)<0){finish();}
 else{go(picks.indexOf(null));}
}
function pick(i){
 picks[cur]=i;
 if(cur<QS.length-1){go(cur+1);}
 else if(picks.indexOf(null)<0){finish();}
 else{go(picks.indexOf(null));}
}
function finish(){
 var seq=picks.map(function(i,qi){return QS[qi].o[i][1];});
 var cnt={};
 seq.forEach(function(k){cnt[k]=(cnt[k]||0)+1;});
 var best=0;Object.keys(cnt).forEach(function(k){if(cnt[k]>best)best=cnt[k];});
 var tied=Object.keys(cnt).filter(function(k){return cnt[k]===best;});
 var key=tied[0];
 for(var i=seq.length-1;i>=0;i--){ if(tied.indexOf(seq[i])>=0){key=seq[i];break;} }
 var tot=[0,0,0];
 seq.forEach(function(k){
   tot[0]+=SIG[k[0]];tot[1]+=SIG[k[1]];tot[2]+=SIG[k[2]];
 });
 res={key:key,pct:tot.map(function(v){return Math.round((v+QS.length)/(2*QS.length)*100);})};
 var M=T[key];
 document.documentElement.style.setProperty('--accent',M.color);
 document.documentElement.style.setProperty('--accent-fg',M.fg);
 document.documentElement.style.setProperty('--accent-tx',M.tx);
 drawCard(M);buildRead(M);show('result');window.scrollTo(0,0);
}
function buildRead(M){var h='';M.sections.forEach(function(s){h+='<h3>'+s[0]+'</h3><p>'+s[1]+'</p>';});document.getElementById('read').innerHTML=h;}
function spaced(ctx,text,x,y,gap){var cx=x;for(var i=0;i<text.length;i++){ctx.fillText(text[i],cx,y);cx+=ctx.measureText(text[i]).width+gap;}return cx;}
function wrapText(ctx,text,x,y,maxW,lh){
 var chars=text.split(''),line='';
 chars.forEach(function(ch){if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,y);y+=lh;line=ch;}else{line+=ch;}});
 if(line){ctx.fillText(line,x,y);}return y+lh;
}
function drawCard(M){
 var cv=document.getElementById('card'),ctx=cv.getContext('2d');
 var W=1080,H=1440,P=92,A=M.color,ATX=M.tx;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=CREAM;ctx.fillRect(0,0,W,H);
 var g=ctx.createLinearGradient(W,0,0,H);g.addColorStop(0,A+'33');g.addColorStop(.55,A+'00');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=A;ctx.fillRect(0,0,W,10);
 ctx.textBaseline='alphabetic';
 ctx.fillStyle=INK;ctx.font='700 30px '+SANS;ctx.textAlign='left';spaced(ctx,TEST.brand,P,120,4);
 ctx.fillStyle=ATX;ctx.font='700 28px '+SANS;ctx.textAlign='right';ctx.fillText('No.'+TEST.id,W-P,120);
 ctx.strokeStyle='rgba(22,21,29,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P,164);ctx.lineTo(W-P,164);ctx.stroke();
 ctx.fillStyle=INK;ctx.textAlign='left';
 var _nf=150;ctx.font='800 '+_nf+'px '+SANS;
 while(ctx.measureText(M.n).width>W-2*P && _nf>84){_nf-=6;ctx.font='800 '+_nf+'px '+SANS;}
 ctx.fillText(M.n,P,384);
 ctx.fillStyle=ATX;ctx.font='600 33px '+SANS;ctx.fillText(M.sub,P+4,438);
 ctx.fillStyle=INK;ctx.font='400 42px '+SANS;
 var qy=wrapText(ctx,M.quote,P,556,W-2*P,60);
 ctx.fillStyle=MUTED;ctx.font='400 28px '+SANS;spaced(ctx,M.kw,P,qy+26,4);
 var y=Math.max(qy+122,724);
 AXES.forEach(function(ax,i){
  ctx.fillStyle=MUTED;ctx.font='400 26px '+SANS;ctx.textAlign='left';ctx.fillText(ax.label,P,y);
  var bx=P+240,bw=560;
  ctx.fillStyle='rgba(22,21,29,.09)';ctx.fillRect(bx,y-19,bw,12);
  var gr=ctx.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,A);gr.addColorStop(1,A+'88');
  ctx.fillStyle=gr;ctx.fillRect(bx,y-19,bw*res.pct[i]/100,12);
  ctx.fillStyle=INK;ctx.font='700 27px '+SANS;ctx.textAlign='right';ctx.fillText(res.pct[i],W-P,y);
  y+=58;
 });
 y+=24;
 ctx.fillStyle=A;ctx.fillRect(P,y-22,5,96);
 ctx.fillStyle='#3A362E';ctx.font='400 31px '+SANS;ctx.textAlign='left';
 y=wrapText(ctx,M.callout[0],P+26,y+8,W-P-26-P,44);
 wrapText(ctx,M.callout[1],P+26,y+8,W-P-26-P,44);
 ctx.fillStyle=MUTED;ctx.font='400 25px '+SANS;ctx.textAlign='left';
 ctx.fillText('趣味测试 · 仅供娱乐 · 非专业心理测评',P,H-72);
 ctx.textAlign='right';ctx.fillStyle=ATX;ctx.font='700 25px '+SANS;ctx.fillText(TEST.brand+' · '+M.n,W-P,H-72);
}
function save(){var a=document.createElement('a');a.download=TEST.brand+'-'+T[res.key].n+'.png';
 a.href=document.getElementById('card').toDataURL('image/png');a.click();}
function copyTxt(){
 var M=T[res.key];
 var txt='【隐藏人格图鉴】'+M.n+' · '+M.sub+'\n「'+M.quote+'」\n'+M.kw+'\n'+
  AXES.map(function(a,i){return a.label+' '+res.pct[i];}).join(' / ')+'\n\n'+
  M.callout[0]+'\n'+M.callout[1]+'\n\n（趣味测试，仅供娱乐）';
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){alert('已复制，去分享吧');});}
 else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('已复制，去分享吧');}catch(e){}document.body.removeChild(ta);}
}
</script>
